<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Especial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden; font-family: sans-serif;
        }
        .story-container {
            width: 100%; 
            max-width: 56.25vh;
            max-width: 56.25dvh; 
            height: 100vh;
            height: 100dvh; 
            position: relative; overflow: hidden;
        }
        
        /* Uso intensivo de -webkit- para suportar iPhones de 10 anos atrás (iPhone 5/6) */
        .page {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-size: cover; 
            background-position: center;
            opacity: 0; 
            visibility: hidden;
            
            -webkit-filter: blur(20px);
            filter: blur(20px); 
            
            -webkit-transform: scale(1.05); 
            transform: scale(1.05); 
            
            -webkit-transition: opacity 1s ease, -webkit-filter 1s ease, -webkit-transform 1s ease;
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
            z-index: 10;
        }

        .page.active { 
            opacity: 1; 
            visibility: visible;
            -webkit-filter: blur(0px);
            filter: blur(0px);
            -webkit-transform: scale(1);
            transform: scale(1);
        }
        
        #drag-el {
            position: fixed;
            bottom: 12%;
            left: 50%;
            -webkit-transform: translateX(-50%);
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027095/elemento_abhwac.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 9999;
            cursor: grab;
            touch-action: none;
            -webkit-animation: pulsar 2s infinite ease-in-out;
            animation: pulsar 2s infinite ease-in-out;
        }

        @-webkit-keyframes pulsar {
            0% { -webkit-transform: translateX(-50%) scale(1); -webkit-filter: brightness(1); }
            50% { -webkit-transform: translateX(-50%) scale(1.1); -webkit-filter: brightness(1.2); }
            100% { -webkit-transform: translateX(-50%) scale(1); -webkit-filter: brightness(1); }
        }

        @keyframes pulsar {
            0% { transform: translateX(-50%) scale(1); filter: brightness(1); }
            50% { transform: translateX(-50%) scale(1.1); filter: brightness(1.2); }
            100% { transform: translateX(-50%) scale(1); filter: brightness(1); }
        }

        #video-p2 { width: 100%; height: 100%; object-fit: cover; }
        
        .controls-row {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; z-index: 100; pointer-events: none;
        }
        .control-btn {
            pointer-events: auto; padding: 10px 20px; border-radius: 30px;
            background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3);
            font-size: 12px; font-weight: bold; cursor: pointer; 
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
        }

        .hotspot { position: absolute; z-index: 40; cursor: pointer; }
        .btn-back {
            position: absolute; top: 20px; left: 20px; padding: 8px 16px;
            background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 60;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="audio.mp3" loop playsinline preload="auto"></audio>

    <div class="story-container">
        
        <div class="controls-row">
            <button id="btn-sound" class="control-btn" onclick="toggleSound()">🔊 SOM</button>
            <button id="btn-skip" class="control-btn" style="display:none;" onclick="skipP2()">PULAR ➔</button>
        </div>

        <div id="page-1" class="page active" style="background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027096/pg1.jpg_q2rlrs.jpg');">
            <div id="drag-el"></div>
        </div>

        <div id="page-2" class="page" style="background-color: #000;">
            <video id="video-p2" src="video_intro.mp4" playsinline webkit-playsinline preload="auto"></video>
        </div>

        <div id="page-3" class="page" style="background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027096/menu.jpg_kgwtuj.jpg');">
      <a href="https://crispoparte.com.br/confirmarmelissa/" target="_blank" class="hotspot" style="top:52.83%; left:18.84%; width:19.37%; height:12.77%;"></a>
      <div class="hotspot" onclick="event.stopPropagation(); goToPage(4)" style="top:53.21%; left:62.15%; width:20.07%; height:12.57%;"></div>
      <a href="https://maps.app.goo.gl/pAwaVCFZuan2GFo77" target="_blank" class="hotspot" style="top:52.63%; left:40.67%; width:18.66%; height:15.28%;"></a>
        </div>

        <div id="page-4" class="page" style="background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027096/pag4.jpg_mbxjsn.jpg'); cursor:pointer;" onclick="goToPage(3)">
            <button class="btn-back" onclick="event.stopPropagation(); goToPage(3)">✕ Voltar</button>

        </div>


    </div>

    <script>
        // Utilizando "var" e "function" padrão para máxima compatibilidade em dispositivos legados.
        var audio = document.getElementById('bg-music');
        var dragEl = document.getElementById('drag-el');
        var btnSkip = document.getElementById('btn-skip');
        var btnSound = document.getElementById('btn-sound');
        var isVideo = true;

        // ESTRATÉGIA DE DESTRAVAMENTO DE MÍDIA GLOBAL (Xiaomi, iOS 17+, etc)
        var mediaUnlocked = false;
        function unlockMedia() {
            if (mediaUnlocked) return;
            mediaUnlocked = true;
            
            // Um play e pause imediato força o navegador a liberar o áudio/vídeo
            var playAudioPromise = audio.play();
            if (playAudioPromise !== undefined) {
                playAudioPromise.then(function() { audio.pause(); }).catch(function(e) {});
            }
            
            if (isVideo) {
                var vid = document.getElementById('video-p2');
                if (vid) {
                    var playVidPromise = vid.play();
                    if (playVidPromise !== undefined) {
                        playVidPromise.then(function() { vid.pause(); }).catch(function(e) {});
                    }
                }
            }
            
            window.removeEventListener('touchstart', unlockMedia);
            window.removeEventListener('mousedown', unlockMedia);
        }
        
        // O primeiro toque do usuário em qualquer lugar da tela destrava tudo silenciosamente
        window.addEventListener('touchstart', unlockMedia, { passive: true });
        window.addEventListener('mousedown', unlockMedia, { passive: true });

        var isDragging = false;
        var offsetX, offsetY;

        function getEvent(e) {
            return (e.touches && e.touches.length > 0) ? e.touches[0] : e;
        }

        function startDrag(e) {
            if (e.type === 'mousedown') e.preventDefault(); 
            isDragging = true;
            dragEl.style.animation = 'none';
            dragEl.style.webkitAnimation = 'none';
            
            var evt = getEvent(e);
            var rect = dragEl.getBoundingClientRect();
            
            offsetX = evt.clientX - rect.left;
            offsetY = evt.clientY - rect.top;
            
            dragEl.style.transition = 'none';
            dragEl.style.webkitTransition = 'none';
        }

        function dragMove(e) {
            if(!isDragging) return;
            if(e.cancelable) e.preventDefault();
            
            var evt = getEvent(e);
            var targetX = evt.clientX - offsetX;
            var targetY = evt.clientY - offsetY;
            var parentRect = dragEl.parentElement.getBoundingClientRect();
            
            dragEl.style.left = (targetX - parentRect.left) + 'px';
            dragEl.style.top = (targetY - parentRect.top) + 'px';
            dragEl.style.bottom = 'auto';
            dragEl.style.transform = 'none';
            dragEl.style.webkitTransform = 'none';
        }

        function endDrag(e) {
            if(!isDragging) return;
            isDragging = false;
            dragEl.style.animation = 'pulsar 2s infinite ease-in-out';
            dragEl.style.webkitAnimation = 'pulsar 2s infinite ease-in-out';

            var rect = dragEl.getBoundingClientRect();
            var centerX = window.innerWidth / 2;
            var centerY = window.innerHeight / 2;
            
            var distX = Math.abs((rect.left + rect.width/2) - centerX);
            var distY = Math.abs((rect.top + rect.height/2) - centerY);
            
            if (distX < 100 && distY < 100) {
                 // Agora toca 100% das vezes graças ao unlockMedia()
                 audio.play().catch(function(e) { console.log(e); });
                 goToPage(2);
            }
        }

        dragEl.addEventListener('mousedown', startDrag);
        dragEl.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('touchmove', dragMove, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function goToPage(num) {
            var targetPage = document.getElementById('page-' + num);
            if (!targetPage) return; 

            var pages = document.querySelectorAll('.page');
            for(var i = 0; i < pages.length; i++) {
                pages[i].classList.remove('active');
            }
            targetPage.classList.add('active');

            if (num === 2) {
                btnSkip.style.display = 'block';
                if (isVideo) {
                    var vid = document.getElementById('video-p2');
                    vid.currentTime = 0;
                    
                    var playPromise = vid.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(function(error) {
                            console.log("Vídeo bloqueado pelo iOS antigo, pulando página:", error);
                            goToPage(3);
                        });
                    }
                    vid.onended = function() { goToPage(3); };
                } else {
                    setTimeout(function() { 
                        if(document.getElementById('page-2').classList.contains('active')) goToPage(3); 
                    }, 5000);
                }
            } else {
                btnSkip.style.display = 'none';
                if(isVideo) {
                    var vidEl = document.getElementById('video-p2');
                    if(vidEl) vidEl.pause();
                }
            }
        }

        function skipP2() { goToPage(3); }

        function toggleSound() {
            if(audio.paused) { audio.play(); btnSound.innerHTML = '🔊 SOM'; }
            else { audio.pause(); btnSound.innerHTML = '🔇 MUTADO'; }
        }
    </script>
</body>
</html>
