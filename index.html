<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Especial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            height: 100dvh; overflow: hidden; font-family: sans-serif;
        }
        .story-container {
            width: 100%; max-width: 56.25dvh; height: 100dvh; position: relative; overflow: hidden;
        }
        .page {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-size: cover; 
            background-position: center;
            opacity: 0; 
            visibility: hidden;
            filter: blur(20px); 
            transform: scale(1.05); 
            transition: opacity 1s ease, filter 1s ease, transform 1s ease;
            z-index: 10;
        }

        .page.active { 
            opacity: 1; 
            visibility: visible;
            filter: blur(0px);
            transform: scale(1);
        }
        
        #drag-el {
            position: fixed;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027095/elemento_abhwac.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 9999;
            cursor: grab;
            touch-action: none;
            animation: pulsar 2s infinite ease-in-out;
        }

        @keyframes pulsar {
            0% { transform: translateX(-50%) scale(1); filter: brightness(1); }
            50% { transform: translateX(-50%) scale(1.1); filter: brightness(1.2); }
            100% { transform: translateX(-50%) scale(1); filter: brightness(1); }
        }

        #video-p2 { width: 100%; height: 100%; object-fit: cover; }
        
        .controls-row {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; z-index: 100; pointer-events: none;
        }
        .control-btn {
            pointer-events: auto; padding: 10px 20px; border-radius: 30px;
            background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3);
            font-size: 12px; font-weight: bold; cursor: pointer; backdrop-filter: blur(4px);
        }

        .hotspot { position: absolute; z-index: 40; cursor: pointer; }
        .btn-back {
            position: absolute; top: 20px; left: 20px; padding: 8px 16px;
            background: rgba(0,0,0,0.5); color: #fff; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 60;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="audio.mp3" loop playsinline></audio>

    <div class="story-container">
        
        <div class="controls-row">
            <button id="btn-sound" class="control-btn" onclick="toggleSound()">🔊 SOM</button>
            <button id="btn-skip" class="control-btn" style="display:none;" onclick="skipP2()">PULAR ➔</button>
        </div>

        <div id="page-1" class="page active" style="background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027096/pg1.jpg_q2rlrs.jpg');">
            <div id="drag-el"></div>
        </div>

        <div id="page-2" class="page" style="background-color: #000;">
            <video id="video-p2" src="video_intro.mp4" playsinline webkit-playsinline></video>
        </div>

        <div id="page-3" class="page" style="background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027096/menu.jpg_kgwtuj.jpg');">
      <a href="https://agatha-crispopartecombr.netlify.app/" target="_blank" class="hotspot" style="top:53.68%; left:19.08%; width:18.31%; height:12.19%;"></a>
      <a href="https://maps.app.goo.gl/726QvQcXkcxg5xne6" target="_blank" class="hotspot" style="top:53.87%; left:41.62%; width:15.85%; height:12.57%;"></a>
      <div class="hotspot" onclick="event.stopPropagation(); goToPage(3)" style="top:52.32%; left:62.04%; width:20.07%; height:14.31%;"></div>
        </div>

        <div id="page-4" class="page" style="background-image: url('https://res.cloudinary.com/dtshawz5x/image/upload/v1788027096/pag4.jpg_mbxjsn.jpg'); cursor:pointer;" onclick="goToPage(3)">
            <button class="btn-back" onclick="event.stopPropagation(); goToPage(3)">✕ Voltar</button>

        </div>


    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const dragEl = document.getElementById('drag-el');
        const btnSkip = document.getElementById('btn-skip');
        const btnSound = document.getElementById('btn-sound');
        const isVideo = true;

        let isDragging = false;
        let offsetX, offsetY;

        const getEvent = (e) => (e.touches && e.touches.length > 0) ? e.touches[0] : e;

        const startDrag = (e) => {
            if (e.type === 'mousedown') e.preventDefault(); 
            isDragging = true;
            dragEl.style.animation = 'none';
            
            const evt = getEvent(e);
            const rect = dragEl.getBoundingClientRect();
            
            offsetX = evt.clientX - rect.left;
            offsetY = evt.clientY - rect.top;
            
            dragEl.style.transition = 'none';
        };

        const dragMove = (e) => {
            if(!isDragging) return;
            if(e.cancelable) e.preventDefault();
            
            const evt = getEvent(e);
            const targetX = evt.clientX - offsetX;
            const targetY = evt.clientY - offsetY;
            const parentRect = dragEl.parentElement.getBoundingClientRect();
            
            dragEl.style.left = (targetX - parentRect.left) + 'px';
            dragEl.style.top = (targetY - parentRect.top) + 'px';
            dragEl.style.bottom = 'auto';
            dragEl.style.transform = 'none'; 
        };

        const endDrag = (e) => {
            if(!isDragging) return;
            isDragging = false;
            dragEl.style.animation = 'pulsar 2s infinite ease-in-out';

            const rect = dragEl.getBoundingClientRect();
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const distX = Math.abs((rect.left + rect.width/2) - centerX);
            const distY = Math.abs((rect.top + rect.height/2) - centerY);
            
            if (distX < 100 && distY < 100) {
                 audio.play().catch(e => console.log(e));
                 goToPage(2);
            }
        };

        dragEl.addEventListener('mousedown', startDrag);
        dragEl.addEventListener('touchstart', startDrag, {passive: false});
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('touchmove', dragMove, {passive: false});
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function goToPage(num) {
            const targetPage = document.getElementById('page-' + num);
            if (!targetPage) return; 

            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            targetPage.classList.add('active');

            if (num === 2) {
                btnSkip.style.display = 'block';
                if (isVideo) {
                    const vid = document.getElementById('video-p2');
                    vid.currentTime = 0;
                    vid.play();
                    vid.onended = () => { goToPage(3) };
                } else {
                    setTimeout(() => { if(document.getElementById('page-2').classList.contains('active')) goToPage(3); }, 5000);
                }
            } else {
                btnSkip.style.display = 'none';
                if(isVideo) {
                    const vid = document.getElementById('video-p2');
                    if(vid) vid.pause();
                }
            }
        }

        function skipP2() { goToPage(3); }

        function toggleSound() {
            if(audio.paused) { audio.play(); btnSound.innerHTML = '🔊 SOM'; }
            else { audio.pause(); btnSound.innerHTML = '🔇 MUTADO'; }
        }
    </script>
</body>
</html>
